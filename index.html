<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Currency Explorer</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="converter-card" aria-labelledby="app-title">
      <header class="hero">
        <span class="eyebrow">FOREIGN EXCHANGE · FRANKFURTER API</span>
        <h1 id="app-title">Currency Explorer</h1>
        <p>Convierte divisas utilizando tipos de cambio obtenidos desde una API pública.</p>
      </header>

      <section class="panel">
        <div class="field field-full">
          <label for="cantidad">Cantidad</label>
          <input type="number" id="cantidad" value="100" min="0" step="any">
        </div>

        <div class="currency-grid">
          <div class="field">
            <label for="origen">De</label>
            <select id="origen">
              <option value="EUR" selected>EUR · Euro</option>
              <option value="USD">USD · Dólar estadounidense</option>
              <option value="MXN">MXN · Peso mexicano</option>
              <option value="GBP">GBP · Libra esterlina</option>
              <option value="JPY">JPY · Yen japonés</option>
            </select>
          </div>

          <button id="intercambiar" class="swap" type="button" aria-label="Intercambiar monedas" title="Intercambiar monedas">⇄</button>

          <div class="field">
            <label for="destino">A</label>
            <select id="destino">
              <option value="USD" selected>USD · Dólar estadounidense</option>
              <option value="EUR">EUR · Euro</option>
              <option value="MXN">MXN · Peso mexicano</option>
              <option value="GBP">GBP · Libra esterlina</option>
              <option value="JPY">JPY · Yen japonés</option>
            </select>
          </div>
        </div>

        <button id="convertir" class="primary" type="button">Convertir</button>

        <section id="resultado" class="result" aria-live="polite">
          <span class="result-label">RESULTADO</span>
          <strong id="resultadoTexto">Esperando consulta...</strong>
          <small id="detalleTasa">La tasa se obtendrá al presionar Convertir.</small>
        </section>

        <!-- MISIÓN 11: histórico del tipo de cambio (aparece después de la primera conversión) -->
        <section id="historico" class="history" aria-labelledby="historicoTitulo" hidden>
          <div class="history-head">
            <h2 id="historicoTitulo" class="result-label">HISTÓRICO</h2>
            <div class="period-group" role="group" aria-label="Periodo del histórico">
              <button type="button" class="period" data-dias="7" aria-pressed="false">7 días</button>
              <button type="button" class="period activo" data-dias="30" aria-pressed="true">30 días</button>
              <button type="button" class="period" data-dias="90" aria-pressed="false">90 días</button>
              <button type="button" class="period" data-dias="365" aria-pressed="false">1 año</button>
            </div>
          </div>
          <p id="historicoResumen" class="history-summary" aria-live="polite"></p>
          <div id="grafica" class="chart"></div>
        </section>
      </section>

      <footer class="footer-note">HTML + CSS + JavaScript · Pair Programming</footer>
    </section>
  </main>
  <script src="js/code.js"></script>
</body>
</html>
